name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: |
          npm ci

      - name: Run Biome (format + lint)
        run: |
          npm run lint

      - name: Check for dead code and unused dependencies
        run: |
          npm run knip

      - name: Build (tsc + generated schema and catalog)
        run: |
          npm run docs:build

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        env:
          CI: true
          HUSKY: "0"
        run: |
          npm ci

      - name: Lint commit messages (Conventional Commits drive releases)
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" --verbose

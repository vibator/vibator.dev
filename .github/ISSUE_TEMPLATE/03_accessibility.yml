name: ♿ Accessibility barrier
description: Something on vibator.dev you cannot see, reach, read, or use
title: "♿ <TITLE>"
labels: ["accessibility"]
body:
  - type: textarea
    id: barrier
    attributes:
      label: What stopped you?
      description: What you tried to do, on which page, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        The device with its OS version, the browser, the theme (light or dark), and any assistive technology (screen reader, zoom, keyboard only, high contrast, voice control) with its version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would work for you?
      description: Optional. How you expected it to work, or what would help.
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/vibator/vibator.dev/blob/main/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow Vibator's Code of Conduct
          required: true

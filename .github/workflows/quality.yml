name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".tool-versions"

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Run Biome (format + lint)
        run: |
          bun run lint

      - name: Check the Markdown (remark)
        run: |
          bun run docs:check

      - name: Check for dead code and unused dependencies
        run: |
          bun run knip

      - name: Install Chromium for the accessibility rule
        run: |
          bunx playwright install --with-deps chromium

      - name: Test the vibator rules
        run: |
          bun run test

      - name: Build (docs, site, and search index)
        run: |
          bun run build

      - name: Run the vibator rules (links, accessibility, Markdown)
        run: |
          bun run rules

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".tool-versions"

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Lint commit messages (Conventional Commits drive releases)
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" --verbose

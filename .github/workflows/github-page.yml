name: Github Page

# The docs come from the vibator repository, which releases on its own.
# The site is rebuilt every night to pick up a new release, on a push here,
# and by hand.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: github-page
  cancel-in-progress: false

jobs:
  github-page:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".tool-versions"

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: bun install --frozen-lockfile

      - name: Run build
        run: |
          bun run build

      - name: Deploy GitHub Page 🚀
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # releases/v4
        with:
          branch: gh-pages
          folder: dist
          force: false
          clean-exclude: pr-preview/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
